name: Build and Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Set current date and time
        run: |
          echo "CUR_DATE_TIME=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build APK
        run: docker compose -f docker-compose.mobile.yaml run --rm android sh /app/gradlew assembleDebug

      - name: List compiled files
        run: |
          sudo find ./src/android -name "*.apk"
          sudo find ./src/android -name "*.aab"

      - name: Upload APK to GitHub Releases
        id: release
        uses: softprops/action-gh-release@v3
        with:
          files: src/android/**/**/**/**/**/**.apk
          tag_name: v${{ env.CUR_DATE_TIME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Releases link to Telegram
        uses: appleboy/telegram-action@v0.1.2
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "New APK Release: v${{ env.CUR_DATE_TIME }}\n\nDownload link: ${{ steps.release.outputs.upload_url }}"
