openapi: 3.0.3
info:
  title: Fatec Women API
  description: API for health checks and violence reports.
  version: 1.2.0
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /:
    get:
      summary: Check API status
      operationId: root
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /health:
    get:
      summary: Check API and database health
      operationId: health
      responses:
        '200':
          description: API and database are available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Database health check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
  /reports:
    get:
      summary: List all reports
      operationId: readReports
      responses:
        '200':
          description: Reports ordered from newest to oldest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
    post:
      summary: Create a report
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /reports/{id}/status:
    patch:
      summary: Update report status
      operationId: updateReportStatus
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Report identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusUpdateResponse'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /reports/{id}/history:
    get:
      summary: Get report status change history
      operationId: readReportHistory
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Report identifier
      responses:
        '200':
          description: Status history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusHistoryEntry'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
components:
  schemas:
    ReportCreate:
      type: object
      required:
        - details
      properties:
        name:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        details:
          type: string
        is_anonymous:
          type: boolean
          default: false
    Report:
      allOf:
        - $ref: '#/components/schemas/ReportCreate'
        - type: object
          required:
            - id
            - status
            - is_anonymous
            - created_at
          properties:
            id:
              type: integer
              format: int64
            user_id:
              type: integer
              format: int64
              nullable: true
            status:
              type: string
              enum: [pendente, em_andamento, resolvido, encerrado]
            is_anonymous:
              type: boolean
            created_at:
              type: string
              format: date-time
            user_name:
              type: string
              nullable: true
    StatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [pendente, em_andamento, resolvido, encerrado]
    StatusUpdateResponse:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: integer
        status:
          type: string
    StatusHistoryEntry:
      type: object
      required:
        - id
        - report_id
        - status
        - changed_at
      properties:
        id:
          type: integer
        report_id:
          type: integer
        status:
          type: string
        changed_by:
          type: integer
          nullable: true
        changed_by_name:
          type: string
          nullable: true
        changed_at:
          type: string
          format: date-time
    StatusResponse:
      type: object
      required:
        - status
        - data
        - message
      properties:
        status:
          type: string
          example: ok
        data:
          type: object
          nullable: true
          example: null
        message:
          type: string
          nullable: true
          example: null
    HealthResponse:
      type: object
      required:
        - status
        - data
        - message
      properties:
        status:
          type: string
          example: ok
        data:
          type: object
          required:
            - datetime
            - now
          properties:
            datetime:
              type: string
              format: date-time
            now:
              type: string
        message:
          type: string
          nullable: true
          example: null
    HTTPError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
    ValidationError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
    ValidationErrorItem:
      type: object
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string