services:
  api:
    build: './src/api'
    container_name: api
    environment:
      - 'PORT=3000'
    ports:
      - '3000:3000'
    volumes:
      - './src/api:/app'
    depends_on:
      - 'database'
  database:
    build: './src/database'
    container_name: database
    environment:
      - 'POSTGRES_USER=fatec'
      - 'POSTGRES_PASSWORD=fatec'
      - 'POSTGRES_DB=fatec'
    ports:
      - '5432:5432'
